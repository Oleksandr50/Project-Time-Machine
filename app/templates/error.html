{% extends 'base.html' %}{% block content %}<section class="error-state card"><div class="error-code">{{ status_code }}</div><h1>{{ t('error.title') }}</h1><p class="error-detail">{{ detail }}</p><p class="muted">{{ t('error.help') }}</p><div class="actions"><a class="btn primary" href="{{ url('/') }}">{{ t('nav.dashboard') }}</a><a class="btn" href="{{ '/account' if request.state.user else '/login' }}">{{ t('nav.account') if request.state.user else t('auth.login') }}</a></div></section>{% endblock %}
